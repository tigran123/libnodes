{# The dock's outer element, which decides how this page hears about jobs: a stream
   only while there are jobs, a 15 s poll otherwise -- six open EventSources would
   use up every connection a host allows. #}
<div class="dock" id="job-dock"
  {% if jobs %}
     hx-ext="sse"
     sse-connect="/jobs/stream"
     sse-swap="dock"
     hx-swap="innerHTML"
  {% else %}
     hx-get="/jobs/dock"
     hx-trigger="every 15s"
     hx-swap="outerHTML"
  {% endif %}
>{% include "dock.html" %}</div>
