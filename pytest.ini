[pytest]
testpaths = tests
# The tree is not installed (no pyproject, no editable install), and the console script
# does not prepend the invocation directory the way `python -m pytest` does — so without
# this, `uv run pytest` collects nothing but ModuleNotFoundError: No module named
# 'libnodes'.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
